<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>spotify-clone</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="utility.css" />
    <link rel="stylesheet" href="responsive.css">
  </head>
  <body>
    <div class="container flex bg-black">
      <div class="left">
        <div class="home bg-gray rounded m-1 p-1">
          <div class="logo"><img src="logo.svg" class="invert" alt="" /></div>
          <ul>
            <li><img src="home.svg" alt="home" class="invert" />Home</li>
            <li><img src="search.svg" alt="search" class="invert" />Search</li>
          </ul>
        </div>
        <div class="library bg-gray m-1 rounded p-1">
          <div class="heading">
            <h2>Your Library</h2>
          </div>
          <div class="songslist">
            <ul></ul>
          </div>
          <div class="footer">
            <div>
              <a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a>
            </div>
            <div>
              <a href="https://www.spotify.com/jp/privacy/"
                ><span>Privacy Center</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/legal/privacy-policy/"
                ><span>Privacy Policy</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/legal/cookies-policy/"
                ><span>Cookies</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"
                ><span>About Ads</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/accessibility/"
                ><span>Accessibility</span></a
              >
            </div>
          </div>
        </div>
      </div>
      <div class="right bg-gray rounded">
        <div class="header">
          <div class="nav">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              width="24"
              height="24"
              color="currentColor"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M15 18C15 18 9.00001 13.5811 9 12C8.99999 10.4188 15 6 15 6"
              ></path>
            </svg>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              width="24"
              height="24"
              color="currentColor"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M9.00005 18C9.00005 18 15 13.5811 15 12C15 10.4188 9 6 9 6"
              ></path>
            </svg>
          </div>
          <div class="buttons">
            <button class="signupbtn">Sign up</button>
            <button class="loginbtn">Log in</button>
          </div>
        </div>
        <div class="spotifyPlaylists">
          <h1>Spotify Playlists</h1>
          <div class="cardContainer">
            <div class="card">
              <div class="play">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="64"
                  height="64"
                  viewBox="0 0 64 64"
                >
                  <circle cx="32" cy="32" r="30" fill="#1DB954" />
                  <polygon points="27,21 27,43 45,32" fill="white" />
                </svg>
              </div>
              <img
                src="https://i.scdn.co/image/ab67616d0000b273b175576e0565a880424bc9a1"
                alt=""
              />
              <h2>Thalapathy Kacheri</h2>
              <p>Anirudh Ravichander</p>
            </div>
            <div class="card">
              <div class="play">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="64"
                  height="64"
                  viewBox="0 0 64 64"
                >
                  <circle cx="32" cy="32" r="30" fill="#1DB954" />
                  <polygon points="27,21 27,43 45,32" fill="white" />
                </svg>
              </div>
              <img
                src="https://i.scdn.co/image/ab67616d0000b273b175576e0565a880424bc9a1"
                alt=""
              />
              <h2>Thalapathy Kacheri</h2>
              <p>Anirudh Ravichander</p>
            </div>
          </div>
          <div class="playbar">
            <div class="seekbar">
              <div class="circle"></div>
            </div>
            <div class="abovebar">
              <div class="songinfo"></div>
              <div class="songbuttons">
                <img id="previous" src="previous.svg" alt="" />
                <img id="play" src="play.svg" class="playaudio" alt="" />
                <img id="next" src="next.svg" alt="" />
              </div>
              <div class="songtime"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
